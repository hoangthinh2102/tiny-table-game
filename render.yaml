# Render blueprint: one free web service in Singapore. Matches live in memory, so keep a single instance.
services:
  - type: web
    name: tiny-tumble
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
